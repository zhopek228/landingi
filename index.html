<style>
:root{--bg:#0e0f13;--ink:#f1eee6;--mute:#9a978f;--line:#2a2b31}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:56px 16px}
main{max-width:720px;margin:0 auto}
h1{font-size:clamp(28px,6vw,44px);line-height:1.1;margin:0 0 8px}
p.sub{color:var(--mute);margin:0 0 40px}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
li b{display:block;font-size:18px}
li span{color:var(--mute);font-size:14px}
nav{display:flex;gap:8px;flex-shrink:0}
a{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
a:hover{border-color:var(--ink)}
</style>
</head>
