<style>
/* Layout: a carousel of cans that never stops. Click a can and it flies out to the left,
   its spec sheet opens beside it, the rest keep turning on the right. The page takes the can's colour. */
:root{
  color-scheme: dark;
  --bgA:#3c3f4a;            /* centre glow of the stage */
  --bgB:#0c0d11;            /* edge of the stage */
  --ink:#f4f1e8;            /* text on the stage */
  --line:color-mix(in srgb, var(--ink) 28%, transparent);
  --f-display:"Dela Gothic One","Arial Black",Impact,sans-serif;
  --f-body:"Onest","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --gl:max(16px, env(safe-area-inset-left, 0px));
  --gr:max(16px, env(safe-area-inset-right, 0px));
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bgB);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;overflow:hidden;overscroll-behavior:none}
.layer{position:fixed;inset:0}
.backdrop{background:radial-gradient(80% 80% at 50% 45%, var(--bgA) 0%, var(--bgB) 100%)}
.backdrop::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--ink) 1.2px, transparent 1.7px);background-size:13px 13px;opacity:.1;
  -webkit-mask-image:linear-gradient(115deg, transparent 35%, #000 100%);mask-image:linear-gradient(115deg, transparent 35%, #000 100%)}
.ghost{overflow:hidden;pointer-events:none}
.ghost b{position:absolute;left:50%;top:46%;font-family:var(--f-display);font-weight:400;font-size:min(25vw,48vh);line-height:1;white-space:nowrap;
  color:transparent;-webkit-text-stroke:2px var(--ink);opacity:0;transform:translate(-50%,-50%);will-change:transform,opacity}
#scene{width:100%;height:100%;display:block;touch-action:none}

.ui{pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-left:var(--gl);padding-right:var(--gr);
  padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px)}
.ui button{pointer-events:auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:1.7rem;line-height:1;letter-spacing:.01em}
.logo svg{width:.62em;height:.95em;fill:currentColor}
.meta{font-family:var(--f-mono);font-weight:500;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;text-align:right}

.copy{position:relative;flex:1;min-height:0}
.panel{position:absolute;left:37%;top:50%;width:min(26rem,31vw);opacity:0;visibility:hidden;will-change:transform,opacity,filter}
.panel.idle{left:0;top:auto;bottom:22px;width:min(27rem,40vw)}
.count{font-family:var(--f-mono);font-weight:700;font-size:.78rem;letter-spacing:.14em}
h1{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:clamp(2rem,4.3vw,4.2rem);line-height:.94;letter-spacing:-.01em;margin:10px 0 12px}
.tag{font-weight:700;font-size:clamp(1rem,1.45vw,1.25rem);margin:0 0 6px}
.desc{margin:0;font-size:.98rem}
.specs{margin:18px 0 0;padding:0;border-top:1.5px solid var(--ink)}
.specs div{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:8px 0;border-bottom:1px solid var(--line)}
.specs dt{font-family:var(--f-mono);font-weight:500;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.specs dd{margin:0;font-weight:700;font-size:.95rem;text-align:right}
.dots{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink)}
.dots i.on{background:var(--ink)}
.cue{display:flex;align-items:center;gap:10px;margin-top:16px;font-family:var(--f-mono);font-weight:500;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase}
.cue::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink);animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--line)}100%{box-shadow:0 0 0 14px transparent}}

.dock{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:8px;font:700 .8rem var(--f-body);color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px 7px 8px;cursor:pointer;transition:background .25s,border-color .25s}
.pill i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink)}
.pill[aria-pressed="true"]{border-color:var(--ink);background:color-mix(in srgb, var(--ink) 14%, transparent)}
.back{display:flex;align-items:center;gap:8px;font:700 .8rem var(--f-body);color:var(--bgB);background:var(--ink);border:0;border-radius:999px;padding:10px 16px;cursor:pointer;white-space:nowrap;transition:opacity .3s,transform .3s}
.back[disabled]{opacity:0;transform:translateY(8px);pointer-events:none}
button:focus-visible{outline:2.5px solid var(--ink);outline-offset:3px}

@media (max-width:760px) and (max-height:640px){
  h1{font-size:1.8rem !important}
  .desc{display:none}
  .specs div:nth-child(n+4){display:none}
}
@media (max-width:760px){
  .backdrop{background:radial-gradient(95% 55% at 50% 34%, var(--bgA) 0%, var(--bgB) 100%)}
  .ghost b{top:30%;font-size:34vw}
  .meta{display:none}
  .panel,.panel.idle{left:0;top:auto;bottom:12px;width:100%}
  h1{font-size:clamp(2rem,10vw,3rem);margin:6px 0 8px}
  .desc{font-size:.9rem}
  .specs{margin-top:10px}
  .specs div{padding:5px 0}
  .pill span{display:none}
  .pill{padding:7px}
  .back span{display:none}
  .back{padding:10px 12px}
}
@media (prefers-reduced-motion:reduce){.cue::before{animation:none}}
</style>

<div class="layer backdrop"></div>
<div class="layer ghost" id="ghost" aria-hidden="true"></div>
<div class="layer"><canvas id="scene" aria-label="Karuzela puszek TOK: kliknij puszkę, aby zobaczyć jej parametry"></canvas></div>

<div class="layer ui">
  <header class="bar">
    <div class="logo">T<svg viewBox="0 0 26 40" aria-hidden="true"><path d="M17 0 2 23h9L7 40l17-25h-9z"/></svg>K</div>
    <div class="meta">Napój energetyczny · 500 ml<br>160 mg kofeiny</div>
  </header>
  <main class="copy" id="copy">
    <section class="panel idle" id="idle">
      <div class="count">05 smaków</div>
      <h1>Wybierz<br>swoją moc</h1>
      <p class="desc">Karuzela się nie zatrzymuje. Kliknij dowolną puszkę, a wyjdzie z kręgu razem ze swoimi parametrami.</p>
      <div class="cue">Kliknij puszkę</div>
    </section>
  </main>
  <footer class="dock">
    <div class="pills" id="pills" role="group" aria-label="Smak"></div>
    <button class="back" id="back" type="button" disabled aria-label="Odstaw puszkę do karuzeli">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v5h5"/></svg>
      <span>Wróć do karuzeli</span></button>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const F = [
    {name:['Klasyk','Oryginał'], ghost:'KLASYK', tag:'Ten właśnie smak.', text:'Słodko-kwaśny smak, od którego wszystko się zaczęło. Bez eksperymentów, po prostu energia.',
     notes:'słodko-kwaśny, tutti frutti', sugar:11, extra:['Moc',5], bgA:'#50545f', bgB:'#0e0f13', ink:'#ffe73c', canA:'#30333a', canB:'#060607', lab:'#ffe73c'},
    {name:['Mango','Chili'], ghost:'MANGO', tag:'Słodko. Potem ostro.', text:'Dojrzałe mango w pierwszym łyku i ostra papryczka na koniec. Dla tych, którym zwykła dawka energii nie wystarcza.',
     notes:'mango, papryczka chili', sugar:11, extra:['Ostrość',3], bgA:'#ffc02a', bgB:'#f2540c', ink:'#2b0b00', canA:'#ffc835', canB:'#ec4708', lab:'#2b0b00'},
    {name:['Limonka','Mięta'], ghost:'LIMONKA', tag:'Chłód w jednym łyku.', text:'Kwaśna limonka i lodowata mięta. Orzeźwia, zanim kofeina zdąży zadziałać.',
     notes:'limonka, mięta pieprzowa', extra:['Chłód',5], bgA:'#c6f55a', bgB:'#0f9a62', ink:'#04240f', canA:'#d2f76a', canB:'#0a9159', lab:'#04240f'},
    {name:['Dzika','Wiśnia'], ghost:'WIŚNIA', tag:'Ciemna, cierpka, głośna.', text:'Dojrzała wiśnia z pestkową goryczką. Zero mdłej słodyczy, tylko gęsty owocowy smak.',
     notes:'wiśnia, pestka', extra:['Cierpkość',4], bgA:'#ff5574', bgB:'#740523', ink:'#fff3f5', canA:'#ff6482', canB:'#63031d', lab:'#fff3f5'},
    {name:['Borówka','Lód'], ghost:'LÓD', tag:'Owoc prosto z zamrażarki.', text:'Borówka, czarna porzeczka i mentolowy chłód. Najspokojniejszy smak w całej linii.',
     notes:'borówka, porzeczka, mentol', extra:['Chłód',4], bgA:'#78b0ff', bgB:'#27179a', ink:'#f1f5ff', canA:'#86baff', canB:'#1f1287', lab:'#f1f5ff'}
  ];
  const IDLE = {bgA:'#3c3f4a', bgB:'#0c0d11', ink:'#f4f1e8'};
  const N = F.length, TAU = Math.PI*2, RAD = Math.PI/180;
  const clamp01 = x => x<0?0:x>1?1:x;
  const sstep = (a,b,x) => { const t = clamp01((x-a)/(b-a)); return t*t*(3-2*t); };
  const lerp = (a,b,t) => a+(b-a)*t;
  const hex = h => [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const root = document.documentElement;

  // ---------- DOM ----------
  const copy = document.getElementById('copy'), ghost = document.getElementById('ghost'), pillsEl = document.getElementById('pills');
  const idle = document.getElementById('idle'), back = document.getElementById('back');
  const dots = n => '<span class="dots" aria-hidden="true">'+[1,2,3,4,5].map(k=>'<i'+(k<=n?' class="on"':'')+'></i>').join('')+'</span>';
  const panels = F.map((f,i)=>{
    const s = document.createElement('section'); s.className='panel';
    s.innerHTML = '<div class="count">0'+(i+1)+' / 0'+N+'</div><h1>'+f.name[0]+'<br>'+f.name[1]+'</h1><p class="tag">'+f.tag+'</p><p class="desc">'+f.text+'</p>'+
      '<dl class="specs"><div><dt>Smak</dt><dd>'+f.notes+'</dd></div><div><dt>Kofeina</dt><dd>160 mg</dd></div>'+
      '<div><dt>Cukier</dt><dd>'+(f.sugar?f.sugar+' g na 100 ml':'0 g')+'</dd></div>'+
      '<div><dt>'+f.extra[0]+'</dt><dd>'+f.extra[1]+' z 5'+dots(f.extra[1])+'</dd></div><div><dt>Pojemność</dt><dd>500 ml</dd></div></dl>';
    copy.appendChild(s); return s;
  });
  const ghosts = F.map(f=>{ const b=document.createElement('b'); b.textContent=f.ghost; ghost.appendChild(b); return b; });
  const pills = F.map((f,i)=>{ const b=document.createElement('button'); b.type='button'; b.className='pill'; b.id='pill'+i;
    b.innerHTML='<i style="background:linear-gradient('+f.canA+','+f.canB+')"></i><span>'+f.name.join(' ')+'</span>';
    b.addEventListener('click',()=>select(selected===i?-1:i)); pillsEl.appendChild(b); return b; });

  // ---------- state ----------
  let selected = -1;
  const fly = new Array(N).fill(0);          // 0 = in the carousel, 1 = pulled out to the left
  function select(i){ selected = i; pills.forEach((b,k)=>b.setAttribute('aria-pressed', k===i)); back.disabled = i<0; }
  back.addEventListener('click',()=>select(-1));
  window.addEventListener('keydown',e=>{
    if(e.key==='Escape') select(-1);
    if(e.key==='ArrowRight'){ select(((selected<0?-1:selected)+1)%N); e.preventDefault(); }
    if(e.key==='ArrowLeft'){ select(((selected<0?N:selected)-1+N)%N); e.preventDefault(); }
  });
  let mx=0,my=0,px=0,py=0;
  window.addEventListener('pointermove',e=>{ px=e.clientX/window.innerWidth*2-1; py=e.clientY/window.innerHeight*2-1; },{passive:true});

  const mixed = {a:[0,0,0], b:[0,0,0], k:[0,0,0]};
  function updateUI(){
    let sum=0; const w=fly.map(v=>{ const e=sstep(0,1,v); sum+=e; return e; });
    const wi=Math.max(0,1-sum), tot=sum+wi;
    ['a','b','k'].forEach(k=>mixed[k].fill(0));
    const add=(p,wt)=>{ const A=hex(p.bgA),B=hex(p.bgB),K=hex(p.ink); for(let c=0;c<3;c++){ mixed.a[c]+=A[c]*wt; mixed.b[c]+=B[c]*wt; mixed.k[c]+=K[c]*wt; } };
    add(IDLE,wi/tot);
    F.forEach((f,i)=>{ add(f,w[i]/tot);
      const o=sstep(0.45,1,fly[i]), p=panels[i];
      p.style.visibility=o<0.01?'hidden':'visible'; p.style.opacity=o;
      p.style.transform=(window.innerWidth<=760?'':'translateY(-50%) ')+'translateX('+((1-o)*-40)+'px)'; p.style.filter=o>0.98?'none':'blur('+((1-o)*8).toFixed(1)+'px)';
      ghosts[i].style.opacity=0.1*w[i]; });
    const oi=sstep(0.5,1,wi); idle.style.visibility=oi<0.01?'hidden':'visible'; idle.style.opacity=oi; idle.style.transform='translateY('+((1-oi)*20)+'px)';
    const rgb=a=>'rgb('+a.map(Math.round).join(',')+')';
    root.style.setProperty('--bgA',rgb(mixed.a)); root.style.setProperty('--bgB',rgb(mixed.b)); root.style.setProperty('--ink',rgb(mixed.k));
  }

  // ---------- 3D ----------
  const cv = document.getElementById('scene');
  let three=null; try{ if(window.THREE) three=build(); }catch(e){ three=null; }

  function build(){
    const T=THREE;
    const renderer = new T.WebGLRenderer({canvas:cv, antialias:true, alpha:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2)); renderer.outputEncoding=T.sRGBEncoding;
    const scene = new T.Scene(), camera = new T.PerspectiveCamera(30,1,0.1,100);
    const mk=(w,h)=>{ const c=document.createElement('canvas'); c.width=w; c.height=h||w; return c; };
    const tex=c=>{ const t=new T.CanvasTexture(c); t.encoding=T.sRGBEncoding; t.anisotropy=8; return t; };

    const ec=mk(1024,512), ex=ec.getContext('2d'); ex.fillStyle='#3a3c42'; ex.fillRect(0,0,1024,512);
    const box=(x,y,w,h,a)=>{ const m=Math.max(w,h), g=ex.createRadialGradient(x,y,0,x,y,m); g.addColorStop(0,'rgba(255,255,255,'+a+')'); g.addColorStop(1,'rgba(255,255,255,0)');
      ex.save(); ex.translate(x,y); ex.scale(w/m,h/m); ex.translate(-x,-y); ex.fillStyle=g; ex.fillRect(x-1024,y-1024,2048,2048); ex.restore(); };
    box(512,30,560,110,1); box(330,240,60,250,1); box(700,230,55,250,.95); box(40,260,70,200,.7); box(990,260,70,200,.7); box(512,256,40,150,.55);
    ex.fillStyle='rgba(0,0,0,.55)'; ex.fillRect(0,430,1024,82);
    const et=new T.CanvasTexture(ec); et.mapping=T.EquirectangularReflectionMapping; et.encoding=T.sRGBEncoding;
    const pm=new T.PMREMGenerator(renderer); scene.environment=pm.fromEquirectangular(et).texture; pm.dispose();
    scene.add(new T.HemisphereLight(0xffffff,0x777777,0.95));
    const key=new T.DirectionalLight(0xffffff,0.75); key.position.set(-4,6,8); scene.add(key);

    const dc=mk(1024), dx=dc.getContext('2d'); dx.fillStyle='rgb(128,128,128)'; dx.fillRect(0,0,1024,1024);
    for(let i=0;i<620;i++){ const x=Math.random()*1024, y=Math.random()*1024, r=2+Math.pow(Math.random(),2.2)*13, g=dx.createRadialGradient(x,y-r*0.2,0,x,y,r);
      g.addColorStop(0,'rgb(255,255,255)'); g.addColorStop(.7,'rgb(190,190,190)'); g.addColorStop(1,'rgb(128,128,128)');
      dx.fillStyle=g; dx.beginPath(); dx.ellipse(x,y,r*0.85,r*1.15,0,0,7); dx.fill(); }
    const dtex=new T.CanvasTexture(dc); dtex.wrapS=dtex.wrapT=T.RepeatWrapping; dtex.repeat.set(2,1.4);

    function drawLabel(cx,f){
      const W=2048,H=1280, g=cx.createLinearGradient(0,0,0,H); g.addColorStop(0,f.canA); g.addColorStop(1,f.canB); cx.fillStyle=g; cx.fillRect(0,0,W,H);
      cx.fillStyle=f.lab; cx.globalAlpha=.13;
      for(let y=0;y<26;y++) for(let x=0;x<58;x++){ const r=1+Math.pow(y/25,1.8)*13; cx.beginPath(); cx.arc(18+x*36+(y%2)*18, 560+y*29, r, 0, 7); cx.fill(); }
      cx.globalAlpha=.22; cx.fillStyle='#fff';
      cx.beginPath(); [[1250,60],[900,640],[1080,640],[960,1230],[1340,520],[1150,520],[1330,60]].forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1])); cx.fill();
      cx.globalAlpha=1; cx.fillStyle=f.lab; cx.textAlign='center'; cx.textBaseline='middle';
      cx.save(); cx.translate(1024-70,H/2+10); cx.rotate(-Math.PI/2); cx.font='400 470px "Dela Gothic One", "Arial Black", sans-serif'; cx.fillText('TOK',0,0); cx.restore();
      cx.save(); cx.translate(1024+215,H/2+10); cx.rotate(-Math.PI/2); cx.font='700 50px "JetBrains Mono", monospace';
      cx.fillText((f.name[0]+'  ·  '+f.name[1]).toUpperCase()+'   /   ENERGY   /   500 ML',0,0); cx.restore();
      cx.globalAlpha=.55; cx.fillRect(0,46,W,5); cx.fillRect(0,H-51,W,5); cx.globalAlpha=1;
      cx.textAlign='left'; cx.font='700 30px "JetBrains Mono", monospace'; cx.fillText('SKŁAD',1740,330);
      cx.font='500 24px "JetBrains Mono", monospace';
      ['woda, tauryna 0,4%','kofeina 32 mg/100 ml','witaminy B3, B6, B12','naturalny aromat',f.sugar?'cukier '+f.sugar+' g/100 ml':'bez cukru'].forEach((l,i)=>cx.fillText(l,1740,384+i*38));
      for(let i=0;i<44;i++){ const w=2+((i*7)%5)*2; cx.fillRect(90+i*7.2,860,w>6?5:w,170); }
      cx.fillText('4 607 0 18 0 4',90,1064);
    }

    const bodyGeo=new T.CylinderGeometry(1,1,4.05,96,1,true);
    const lathe=p=>new T.LatheGeometry(p.map(q=>new T.Vector2(q[0],q[1])),96);
    const neckGeo=lathe([[1,1.9],[0.985,2.02],[0.94,2.16],[0.87,2.31],[0.83,2.4]]);
    const rimGeo=lathe([[0.83,2.4],[0.86,2.43],[0.865,2.49],[0.84,2.53],[0.8,2.52],[0.785,2.45]]);
    const baseGeo=lathe([[0.001,-2.36],[0.5,-2.4],[0.7,-2.5],[0.84,-2.51],[0.9,-2.46],[0.96,-2.33],[1,-2.15]]);
    const lidGeo=new T.CircleGeometry(0.79,64), tabGeo=new T.CylinderGeometry(0.2,0.2,0.03,32), holeGeo=new T.CircleGeometry(0.2,32);
    const alu=new T.MeshStandardMaterial({color:'#d7dade', metalness:1, roughness:.28, side:T.DoubleSide});
    const lidMat=new T.MeshStandardMaterial({color:'#c9ccd1', metalness:1, roughness:.38});
    const holeMat=new T.MeshBasicMaterial({color:'#101114'});
    const sh=mk(256), sx=sh.getContext('2d'), sg=sx.createRadialGradient(128,128,0,128,128,128);
    sg.addColorStop(0,'rgba(0,0,0,.6)'); sg.addColorStop(.5,'rgba(0,0,0,.22)'); sg.addColorStop(1,'rgba(0,0,0,0)'); sx.fillStyle=sg; sx.fillRect(0,0,256,256);
    const shTex=new T.CanvasTexture(sh);

    const pickables=[];
    const cans=F.map((f,i)=>{
      const lc=mk(2048,1280); drawLabel(lc.getContext('2d'),f); const lt=tex(lc);
      const outer=new T.Group(), spin=new T.Group(); outer.add(spin); scene.add(outer);
      const body=new T.Mesh(bodyGeo,new T.MeshStandardMaterial({map:lt, metalness:.5, roughness:.3, bumpMap:dtex, bumpScale:.012})); body.position.y=-0.125; body.userData.idx=i; spin.add(body); pickables.push(body);
      spin.add(new T.Mesh(neckGeo,new T.MeshStandardMaterial({color:new T.Color(f.canA).convertSRGBToLinear(), metalness:.5, roughness:.3})));
      spin.add(new T.Mesh(rimGeo,alu), new T.Mesh(baseGeo,alu));
      const lid=new T.Mesh(lidGeo,lidMat); lid.rotation.x=-Math.PI/2; lid.position.y=2.45; spin.add(lid);
      const tab=new T.Mesh(tabGeo,alu); tab.scale.set(1,1,1.7); tab.position.set(0,2.475,-0.12); spin.add(tab);
      const hole=new T.Mesh(holeGeo,holeMat); hole.rotation.x=-Math.PI/2; hole.scale.set(1,1.35,1); hole.position.set(0,2.452,0.36); spin.add(hole);
      const shadow=new T.Mesh(new T.PlaneGeometry(4.6,4.6),new T.MeshBasicMaterial({map:shTex, transparent:true, depthWrite:false, opacity:.5}));
      shadow.rotation.x=-Math.PI/2; scene.add(shadow);
      return {outer, spin, shadow, lc, lt, f, a:TAU*i/N, rot:0, hov:0};
    });
    if(document.fonts && document.fonts.load) Promise.all([document.fonts.load('400 100px "Dela Gothic One"','TOK ŁÓDŹ WIŚNIA'),document.fonts.load('700 50px "JetBrains Mono"','ŁÓDŹ WIŚNIA 500')])
      .then(()=>cans.forEach(c=>{ drawLabel(c.lc.getContext('2d'),c.f); c.lt.needsUpdate=true; })).catch(()=>{});

    function garnish(kind){
      const c=mk(256), x=c.getContext('2d'); x.translate(128,128);
      const ball=(px,py,r,a,b)=>{ const g=x.createRadialGradient(px-r*.35,py-r*.4,r*.1,px,py,r); g.addColorStop(0,a); g.addColorStop(1,b); x.fillStyle=g; x.beginPath(); x.arc(px,py,r,0,7); x.fill(); };
      if(kind==='bolt'){ x.rotate(.25); x.fillStyle='#ffe73c'; x.beginPath(); [[34,-114],[-72,18],[-8,18],[-36,114],[76,-28],[12,-28],[44,-114]].forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])); x.fill(); }
      if(kind==='lime'){ ball(0,0,112,'#9fe04a','#3f8f1f'); x.fillStyle='#e9ffc2'; x.beginPath(); x.arc(0,0,96,0,7); x.fill();
        for(let k=0;k<8;k++){ x.save(); x.rotate(k*Math.PI/4); x.fillStyle='#b5ee62'; x.beginPath(); x.moveTo(0,-8); x.quadraticCurveTo(34,-48,26,-86); x.quadraticCurveTo(0,-96,-26,-86); x.quadraticCurveTo(-34,-48,0,-8); x.fill(); x.restore(); } }
      if(kind==='mint'){ x.rotate(.5); const g=x.createLinearGradient(-60,0,60,0); g.addColorStop(0,'#1f9a55'); g.addColorStop(1,'#6fe09a'); x.fillStyle=g;
        x.beginPath(); x.moveTo(0,-112); x.quadraticCurveTo(84,-30,0,112); x.quadraticCurveTo(-84,-30,0,-112); x.fill(); x.strokeStyle='rgba(0,70,30,.5)'; x.lineWidth=5; x.beginPath(); x.moveTo(0,-100); x.lineTo(0,100); x.stroke(); }
      if(kind==='mango'){ x.rotate(.4); const g=x.createLinearGradient(-80,-80,80,80); g.addColorStop(0,'#ffe36b'); g.addColorStop(1,'#ff9a1c'); x.fillStyle=g;
        x.beginPath(); const r=30; x.moveTo(-88+r,-88); x.arcTo(88,-88,88,88,r); x.arcTo(88,88,-88,88,r); x.arcTo(-88,88,-88,-88,r); x.arcTo(-88,-88,88,-88,r); x.fill();
        x.fillStyle='rgba(255,255,255,.35)'; x.fillRect(-62,-64,54,14); }
      if(kind==='chili'){ x.rotate(-.5); x.fillStyle='#e0220f'; x.beginPath(); x.moveTo(-96,-30); x.quadraticCurveTo(0,-74,100,6); x.quadraticCurveTo(10,-10,-84,26); x.quadraticCurveTo(-112,10,-96,-30); x.fill();
        x.strokeStyle='#2f8f2a'; x.lineWidth=14; x.lineCap='round'; x.beginPath(); x.moveTo(-92,-4); x.quadraticCurveTo(-112,-20,-108,-48); x.stroke(); }
      if(kind==='cherry'){ x.strokeStyle='#3d7a22'; x.lineWidth=7; x.lineCap='round'; x.beginPath(); x.moveTo(-44,10); x.quadraticCurveTo(-20,-70,20,-112); x.moveTo(50,34); x.quadraticCurveTo(46,-50,20,-112); x.stroke();
        ball(-46,46,56,'#ff5f7a','#8f0a24'); ball(52,60,52,'#ff5f7a','#7d061e'); }
      if(kind==='berry'){ ball(0,0,104,'#7f8dff','#1c1570'); x.fillStyle='#120c4a'; for(let k=0;k<5;k++){ x.save(); x.translate(-18,-30); x.rotate(k*Math.PI*2/5); x.beginPath(); x.moveTo(0,0); x.lineTo(9,-26); x.lineTo(-9,-26); x.fill(); x.restore(); } }
      if(kind==='ice'){ x.rotate(.3); const g=x.createLinearGradient(-80,-80,80,80); g.addColorStop(0,'rgba(255,255,255,.95)'); g.addColorStop(1,'rgba(170,215,255,.6)'); x.fillStyle=g;
        x.beginPath(); const r=26; x.moveTo(-84+r,-84); x.arcTo(84,-84,84,84,r); x.arcTo(84,84,-84,84,r); x.arcTo(-84,84,-84,-84,r); x.arcTo(-84,-84,84,-84,r); x.fill();
        x.strokeStyle='rgba(255,255,255,.9)'; x.lineWidth=6; x.stroke(); }
      const t=new T.CanvasTexture(c); t.encoding=T.sRGBEncoding; return t;
    }
    const kinds=[['bolt','ice'],['mango','chili'],['lime','mint'],['cherry','cherry'],['berry','ice']];
    const bits=[]; let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
    kinds.forEach((pair,fi)=>{ const maps=pair.map(garnish);
      for(let k=0;k<10;k++){ const m=new T.SpriteMaterial({map:maps[k%2], transparent:true, depthWrite:false, opacity:0});
        const s=new T.Sprite(m), front=k%5===0, a=Math.PI*(0.55+rnd()*0.9)*(rnd()<.3?-1:1)+(front?0:0), r=1.7+rnd()*1.5;
        s.userData={fi, bx:-Math.abs(Math.sin(a))*r*(rnd()<.25?-0.7:1), by:-2.3+rnd()*5.2, bz:front?1.2+rnd()*0.8:-1.6+rnd()*1.6, sz:(front?0.7:0.42)+rnd()*0.4, ph:rnd()*6.28, sp:(rnd()-.5)*0.7};
        m.rotation=rnd()*6.28; scene.add(s); bits.push(s); } });
    const bc=mk(64), bx2=bc.getContext('2d'); bx2.strokeStyle='rgba(255,255,255,.9)'; bx2.lineWidth=4; bx2.beginPath(); bx2.arc(32,32,24,0,7); bx2.stroke();
    bx2.fillStyle='rgba(255,255,255,.8)'; bx2.beginPath(); bx2.arc(23,22,5,0,7); bx2.fill();
    const btex=new T.CanvasTexture(bc), bubbles=[];
    for(let k=0;k<34;k++){ const s=new T.Sprite(new T.SpriteMaterial({map:btex, transparent:true, depthWrite:false, opacity:.4}));
      s.userData={x:(rnd()-.5)*14, z:-4+rnd()*5, sp:0.5+rnd()*1.1, ph:rnd()*9, sz:0.08+rnd()*0.2}; scene.add(s); bubbles.push(s); }

    // layout: where the pulled-out can sits and where the carousel turns, per screen shape
    let narrow=false, D=16, aspect=1, t=0, ring=0, S=0, hovered=-1;
    const L={fx:0,fy:0,fz:0,fs:1, idle:{}, sel:{}}; const FLOOR=-2.56;
    function resize(){
      const w=window.innerWidth,h=window.innerHeight; aspect=w/h; renderer.setSize(w,h,false); camera.aspect=aspect; narrow=w<=760||aspect<0.85;
      let oy=0; D=Math.max(16,23/aspect);
      if(narrow){ const ph=Math.max.apply(null,panels.concat(idle).map(p=>p.offsetHeight)), bottom=ph+96, avail=Math.max(150,h-bottom-52);
        D=Math.max(10.5/aspect, 13.5*h/avail); oy=(bottom-52)/2; }
      camera.position.set(0,2.1,D); camera.lookAt(0,0.15,-0.8);
      if(narrow) camera.setViewOffset(w,h,0,oy,w,h); else camera.clearViewOffset();
      camera.updateProjectionMatrix();
      const hw=z=>Math.tan(15*RAD)*(D-z)*aspect;
      if(narrow){ L.fz=0.6; L.fx=-0.36*hw(0.6); L.fy=0.1; L.fs=0.98;
        L.sel={cx:0.46*hw(-5), cy:1.0, cz:-5, rx:Math.min(2.0,0.42*hw(-5)), rz:1.7};
        L.idle={cx:0, cy:-1.5, cz:2, rx:Math.min(3.0,0.74*hw(2)), rz:2.4}; }
      else { L.fz=1.4; L.fx=-0.62*hw(1.4); L.fy=0.3; L.fs=1.1;
        L.sel={cx:0.76*hw(-5), cy:0, cz:-5, rx:Math.min(2.3,0.2*hw(-5)), rz:1.9};
        L.idle={cx:0.26*hw(-3), cy:0, cz:-3, rx:Math.min(3.6,0.52*hw(-3)), rz:2.8}; }
    }
    window.addEventListener('resize',resize); resize();
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(resize).catch(()=>{});

    // picking and dragging
    const ray=new T.Raycaster(), v2=new T.Vector2();
    const pick=(x,y)=>{ v2.set(x/window.innerWidth*2-1, -(y/window.innerHeight)*2+1); ray.setFromCamera(v2,camera); const hit=ray.intersectObjects(pickables,false); return hit.length?hit[0].object.userData.idx:-1; };
    let down=null;
    cv.addEventListener('pointerdown',e=>{ down={x:e.clientX, ring, moved:false}; try{cv.setPointerCapture(e.pointerId);}catch(_){} });
    cv.addEventListener('pointermove',e=>{
      if(down){ const dxp=e.clientX-down.x; if(Math.abs(dxp)>6) down.moved=true; if(down.moved){ ring=down.ring+dxp*0.008; cv.style.cursor='grabbing'; } }
      else { hovered=pick(e.clientX,e.clientY); cv.style.cursor=hovered>=0?'pointer':'grab'; } });
    cv.addEventListener('pointerup',e=>{ if(down && !down.moved){ const i=pick(e.clientX,e.clientY); if(i>=0) select(selected===i?-1:i); } down=null; cv.style.cursor='grab'; });
    cv.addEventListener('pointercancel',()=>{ down=null; });
    cv.addEventListener('pointerleave',()=>{ hovered=-1; });

    const angDiff=(a,b)=>{ let d=(a-b)%TAU; if(d>Math.PI) d-=TAU; if(d<-Math.PI) d+=TAU; return d; };
    function update(dt){
      t+=dt; mx+=(px-mx)*Math.min(1,dt*4); my+=(py-my)*Math.min(1,dt*4);
      const live=reduce?0:1;
      if(!down) ring+=dt*0.32*live;
      S+=((selected>=0?1:0)-S)*Math.min(1,dt*3);
      const R={}; ['cx','cy','cz','rx','rz'].forEach(k=>R[k]=lerp(L.idle[k],L.sel[k],sstep(0,1,S)));
      const members=cans.map((c,i)=>i).filter(i=>i!==selected), M=members.length;
      cans.forEach((c,i)=>{
        const inRing=i!==selected, tgt=inRing?0:1;
        const wasOut=fly[i]>0.999; fly[i]+=(tgt-fly[i])*Math.min(1,dt*3.4); if(Math.abs(tgt-fly[i])<0.001) fly[i]=tgt;
        if(inRing){ const want=ring+TAU*members.indexOf(i)/M; c.a+=angDiff(want,c.a)*Math.min(1,dt*3); }
        else if(fly[i]<0.02 || !c.rot) c.rot=Math.PI+TAU*Math.round(c.a/TAU);          // remember the label-forward turn when leaving the ring
        const e=sstep(0,1,fly[i]);
        const rx=Math.sin(c.a)*R.rx+R.cx, rz=Math.cos(c.a)*R.rz+R.cz;
        c.hov+=(((hovered===i&&inRing)?1:0)-c.hov)*Math.min(1,dt*8);
        const x=lerp(rx,L.fx,e), z=lerp(rz,L.fz,e), y=lerp(R.cy+c.hov*0.18,L.fy+Math.sin(t*1.1)*0.07*live,e)+Math.sin(Math.PI*e)*0.9;
        c.outer.position.set(x,y,z);
        c.outer.rotation.set((my*0.08+0.05)*e, mx*0.22*e, -0.2*e);
        c.outer.scale.setScalar(lerp(1+c.hov*0.05,L.fs,e));
        c.spin.rotation.y=lerp(c.a+Math.PI, c.rot||Math.PI, e)+Math.sin(t*0.6)*0.32*e*live;
        c.shadow.position.set(x+0.2*e, FLOOR+lerp(R.cy,0,e), z+0.15); c.shadow.material.opacity=0.5-0.22*e; c.shadow.scale.setScalar(1+0.25*e);
      });
      bits.forEach(s=>{ const u=s.userData, w=sstep(0.35,1,fly[u.fi]); s.visible=w>0.01; if(!s.visible) return;
        const k=1+(1-w)*1.8, kk=narrow?0.7:1; s.position.set(L.fx+u.bx*k*kk, L.fy+(u.by+Math.sin(t*0.8+u.ph)*0.18*live)*k*0.92, L.fz+u.bz*k);
        s.scale.setScalar(u.sz*(0.4+0.6*w)); s.material.opacity=w; s.material.rotation+=u.sp*dt*live; });
      bubbles.forEach(s=>{ const u=s.userData, y=((t*u.sp+u.ph)%8)-3.6; s.position.set(u.x+Math.sin(t+u.ph)*0.12, y, u.z); s.scale.setScalar(u.sz); s.material.opacity=0.42*sstep(-3.6,-2.6,y)*(1-sstep(3,4.4,y)); });
    }
    return {update, render:()=>renderer.render(scene,camera)};
  }

  let last=performance.now();
  function frame(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    if(three) three.update(dt); else F.forEach((f,i)=>{ fly[i]=i===selected?1:0; });
    updateUI(); if(three) three.render();
    requestAnimationFrame(frame);
  }
  updateUI(); requestAnimationFrame(frame);
})();
</script>

</body>
